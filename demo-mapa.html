<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PPAM · Demo del mapa con zoom</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#F6F5F1;--card:#fff;--ink:#0E1A24;--ink2:#4A5561;--ink3:#8A939C;--line:#E7E5DF;--line2:#EFEDE8;--pri:#12433F;--gold:#D7B774;--ok:#1F7A55;--warn:#8A6410}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#1C5C56,#0D2F2C);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.mark b{font-weight:800;font-size:10.5px;color:#F6F5F1;line-height:1}.mark i{width:18px;height:2px;border-radius:2px;background:var(--gold)}
.top .t b{display:block;font-size:15px}.top .t small{color:var(--ink3);font-size:11.5px}.demo{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#8A6410;background:#F7EEDB;border-radius:999px;padding:3px 8px}
.seg2{display:flex;background:var(--line2);border-radius:13px;padding:3px;gap:3px;margin:6px 16px 10px}.seg2 span{flex:1;text-align:center;font-size:13.5px;font-weight:600;color:var(--ink2);padding:7px;border-radius:10px}.seg2 span.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mapw{position:relative;flex:1;min-height:0;margin:0 12px 12px;border-radius:22px;overflow:hidden;border:1px solid var(--line2)}
#map{position:absolute;inset:0;background:#E9EFEC}
.leaflet-tile-pane{filter:saturate(.45) sepia(.1) brightness(1.03)}
.leaflet-container{font:inherit}
.ctl{position:absolute;right:10px;top:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.ctl button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;min-width:40px;height:38px;font:inherit;font-weight:700;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.1);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 10px}
.ctl button.txt{font-size:12.5px;font-weight:600}
.leg{position:absolute;left:10px;top:10px;z-index:500;background:rgba(255,255,255,.92);border-radius:10px;padding:6px 9px;font-size:11px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap;max-width:62%}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* pines */
.pp{position:relative;width:0;height:0}
.pp .pin{position:absolute;left:-15px;top:-38px;width:30px;height:38px;transition:transform .35s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 100%;cursor:pointer;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.pp .pin:active{transform:scale(1.12)}
.pp .lab{position:absolute;top:4px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);pointer-events:none}
.pp .lab small{font-weight:600;color:var(--ink3);margin-left:3px}
.pp.pt .pin{transform:scale(.85)}
.pp .rip{position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;border:3px solid var(--gold);opacity:0;pointer-events:none}
.pp.go .rip{animation:rip .9s ease-out}
@keyframes rip{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(8)}}
.pp .fan{position:absolute;left:0;top:-36px;pointer-events:none}
.pp .ph{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--gold);background:#2F4B7A center/cover;box-shadow:0 6px 14px rgba(0,0,0,.25);transform:scale(0);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.pp .ph::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--gold);border-bottom:0}
.pp.sel .pin{transform:scale(0);transition:transform .2s ease-in}.pp.sel .ph{transform:scale(1)}
.pp.sel .lab{top:16px}
.dim .pp:not(.sel){opacity:.35}.pp{transition:opacity .3s}
/* tarjeta */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:600;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:8px 14px 14px;max-height:58%;overflow-y:auto}
.sheet.on{transform:none}.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.cc{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2);opacity:0;transform:translateY(12px);transition:opacity .35s,transform .35s}.sheet.on .cc{opacity:1;transform:none}.cc:first-of-type{border-top:none}
.cc .im{width:66px;height:66px;border-radius:15px;flex-shrink:0;background:center/cover;box-shadow:0 6px 14px rgba(0,0,0,.15)}.cc .tx{flex:1;min-width:0}.cc b{display:block;font-size:15px}.cc small{display:block;color:var(--ink3);font-size:12.5px}.cc .f{display:block;font-size:12.5px;font-weight:600;margin-top:2px;color:var(--ok)}.cc .f.poco{color:var(--warn)}.cc .f.full{color:var(--ink3)}
.cc button{border:none;background:var(--pri);color:#fff;font:inherit;font-weight:700;font-size:13px;border-radius:12px;padding:9px 11px;white-space:nowrap;cursor:pointer}
.yo{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#4A8FE7;border:3px solid #fff;box-shadow:0 0 0 0 rgba(74,143,231,.5);animation:yo 1.8s infinite}
@keyframes yo{0%{box-shadow:0 0 0 0 rgba(74,143,231,.5)}100%{box-shadow:0 0 0 18px rgba(74,143,231,0)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0E1A24;color:#fff;font-size:13px;padding:9px 14px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:999;max-width:90%;text-align:center}.toast.on{opacity:1;transform:translateX(-50%)}
.leaflet-control-attribution{font-size:9.5px!important;background:rgba(255,255,255,.75)!important}
@media (prefers-reduced-motion: reduce){.pp .pin,.pp .ph,.sheet,.cc{transition:none!important}.pp.go .rip,.yo{animation:none}}

  { id: 'lpz-pto', n: 'Puerto', ciu: 'La Paz', foto: 'puerto', est: 'full', f: 'Completo esta semana', fechas: '14 oct al 30 nov', pts: [['Puerto', -30.7414, -59.6413]] }
];
const COL = { ok: '#1F7A55', poco: '#B8924A', full: '#8A939C' };
const pinSvg = (c, txt) => `<svg class="pin" viewBox="0 0 30 38"><path d="M15 37c-9-12-14-18-14-24a14 14 0 0 1 28 0c0 6-5 12-14 24z" fill="${c}" stroke="#fff" stroke-width="2"/>${txt ? `<text x="15" y="18" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">${txt}</text>` : '<circle cx="15" cy="13" r="5" fill="#fff"/>'}</svg>`;
CAMPS.forEach(c => { c.lat = c.pts.reduce((a, p) => a + p[1], 0) / c.pts.length; c.lng = c.pts.reduce((a, p) => a + p[2], 0) / c.pts.length; });

const map = L.map('map', { zoomControl: false, attributionControl: true, minZoom: 7, maxZoom: 18, zoomSnap: .25, wheelPxPerZoomLevel: 90 });
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
// Provincia resaltada: el resto del mundo velado y el contorno en verde
const prov = ER.prov.map(r => r.map(([x, y]) => [y, x]));
L.polygon([[[-89, -179], [-89, 179], [89, 179], [89, -179]], ...prov], { stroke: false, fillColor: '#F6F5F1', fillOpacity: .72, interactive: false }).addTo(map);
L.polygon(prov, { color: '#12433F', weight: 2.2, fill: false, interactive: false }).addTo(map);
const deps = L.layerGroup(ER.deps.map(d => L.polygon(d.r.map(r => r.map(([x, y]) => [y, x])), { color: '#12433F', weight: .8, opacity: .25, fill: false, interactive: false }))).addTo(map);
const B = L.polygon(prov).getBounds();
map.fitBounds(B, { padding: [14, 14] }); map.setMaxBounds(B.pad(.6));
const fit0 = () => map.fitBounds(B, { padding: [14, 14] });

let capa = L.layerGroup().addTo(map), sel = null;
// Agrupa por cercanía en pantalla: de lejos por ciudad, de cerca cada campaña, muy de cerca cada punto (carrito o stand).
function items() {
  const z = map.getZoom();
  if (z >= 14.5) return CAMPS.flatMap(c => c.pts.map(([pn, la, ln], i) => ({ tipo: 'pt', key: c.id + ':' + i, lat: la, lng: ln, cs: [c], lab: pn, est: c.est })));
  return CAMPS.map(c => ({ tipo: 'camp', key: c.id, lat: c.lat, lng: c.lng, cs: [c], lab: c.n, est: c.est }));
}
function agrupar(list) {
  const out = [], R = 46;
  list.forEach(it => {
    const p = map.latLngToLayerPoint([it.lat, it.lng]);
    const g = out.find(o => o.p.distanceTo(p) < R && o.tipo === it.tipo);
    if (g) { g.items.push(it); g.cs = [...new Set([...g.cs, ...it.cs])]; } else out.push({ tipo: it.tipo, p, items: [it], cs: [...it.cs] });
  });
  return out.map(g => {
    const lat = g.items.reduce((a, i) => a + i.lat, 0) / g.items.length, lng = g.items.reduce((a, i) => a + i.lng, 0) / g.items.length;
    const est = g.cs.some(c => c.est === 'ok') ? 'ok' : g.cs.some(c => c.est === 'poco') ? 'poco' : 'full';
    const ciu = [...new Set(g.cs.map(c => c.ciu))];
    const z = map.getZoom();
    const lab = z < 11 ? (ciu.length === 1 ? ciu[0] : ciu.length + ' localidades')                 // de lejos: la localidad
      : g.items.length === 1 ? g.items[0].lab                                                         // una campaña o un punto: su nombre
      : g.cs.length === 1 ? g.cs[0].n : (ciu.length === 1 ? ciu[0] : ciu.length + ' localidades');   // varios puntos de la misma campaña: la campaña
    const key = g.items.map(i => i.key).sort().join('|');
    return Object.assign(g, { lat, lng, est, lab, key, n: g.items.length });
  });
}
function dibujar() {
  capa.clearLayers();
  const z = map.getZoom();
  agrupar(items()).forEach(g => {
    const sub = g.n > 1 ? `<small>· ${g.n}${g.tipo === 'pt' && g.cs.length === 1 ? ' puntos' : ''}</small>` : '';
    const fan = g.cs.slice(0, 3).map((c, j, a) => `<span class="ph" style="left:${(j - (a.length - 1) / 2) * 50}px;top:-6px;background-image:url('${FOTO[c.foto]}');transition-delay:${.1 + j * .08}s"></span>`).join('');
    const html = `<div class="pp ${g.tipo === 'pt' ? 'pt' : ''}${sel === g.key ? ' sel' : ''}"><span class="rip"></span>${pinSvg(COL[g.est], g.n > 1 ? g.n : '')}<span class="fan">${fan}</span><span class="lab">${g.lab}${sub}</span></div>`;
    const m = L.marker([g.lat, g.lng], { icon: L.divIcon({ className: '', html, iconSize: [0, 0] }), keyboard: true, title: g.lab, riseOnHover: true });
    m.on('click', () => tocar(g, m));
    m.addTo(capa); g.m = m;
  });
}
function tocar(g, m) {
  if (g.n > 1) {
    // Un grupo: acercar hasta que se separe
    cerrar(false);
    const b = L.latLngBounds(g.items.map(i => [i.lat, i.lng]));
    const z = Math.min(map.getBoundsZoom(b.pad(.9)), 17);
    map.flyTo(b.getCenter(), Math.max(z, map.getZoom() + 1.25), { duration: .7 });
    return;
  }
  const c = g.cs[0];
  sel = g.key;
  const el = m.getElement().querySelector('.pp');
  el.classList.add('sel'); el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  document.getElementById('mapw').classList.add('dim');
  const zoom = Math.max(map.getZoom(), g.tipo === 'pt' ? map.getZoom() : 13.5);
  const pt = map.project([g.lat, g.lng], zoom).add([0, map.getSize().y * .22]);
  map.flyTo(map.unproject(pt, zoom), zoom, { duration: .6 });
  document.getElementById('sb').innerHTML = `<h4>${c.ciu}${g.tipo === 'pt' ? ' · ' + g.items[0].lab : ''}</h4><div class="cc" style="transition-delay:.18s"><span class="im" style="background-image:url('${FOTO[c.foto]}')"></span><span class="tx"><b>${c.n}</b><small>${c.ciu} · ${c.fechas} · ${c.pts.length} ${c.pts.length === 1 ? 'punto' : 'puntos'}</small><span class="f ${c.est}">${c.f}</span></span><button onclick="toast('En la app abre la campaña «${c.n}»')">Ver turnos</button></div>`;
  const sh = document.getElementById('sheet'); sh.classList.remove('on'); void sh.offsetWidth; sh.classList.add('on');
}
function cerrar(redraw = true) {
  sel = null; document.getElementById('mapw').classList.remove('dim'); document.getElementById('sheet').classList.remove('on');
  document.querySelectorAll('.pp.sel').forEach(e => e.classList.remove('sel'));
  if (redraw) dibujar();
}
map.on('zoomend', () => { if (!sel) dibujar(); });
map.on('click', () => cerrar());
map.on('zoom', () => { const z = map.getZoom(); deps.eachLayer(l => l.setStyle({ opacity: z < 10 ? .25 : 0 })); });
dibujar();
document.getElementById('zin').onclick = () => map.zoomIn(1);
document.getElementById('zout').onclick = () => map.zoomOut(1);
document.getElementById('all').onclick = () => { cerrar(); fit0(); };
let yo = null;
document.getElementById('near').onclick = () => {
  if (!navigator.geolocation) return toast('Este navegador no comparte la ubicación');
  toast('Buscando dónde estás…');
  navigator.geolocation.getCurrentPosition((pos) => {
    const here = L.latLng(pos.coords.latitude, pos.coords.longitude);
    if (yo) yo.remove(); yo = L.marker(here, { icon: L.divIcon({ className: '', html: '<div class="yo"></div>', iconSize: [0, 0] }), interactive: false }).addTo(map);
    const c = CAMPS.map(c => ({ c, d: here.distanceTo([c.lat, c.lng]) / 1000 })).sort((a, b) => a.d - b.d)[0];
    toast(`La más cercana: ${c.c.n}, ${c.c.ciu} (${c.d < 1 ? 'acá cerca' : Math.round(c.d) + ' km'})`);
    map.flyTo([c.c.lat, c.c.lng], 14, { duration: 1 });
    map.once('moveend', () => { const g = agrupar(items()).find(g => g.cs.length === 1 && g.cs[0].id === c.c.id); if (g) tocar(g, g.m); });
  }, () => toast('No se pudo saber dónde estás (revisá el permiso de ubicación)'), { timeout: 10000 });
};
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
</script></body></html>
