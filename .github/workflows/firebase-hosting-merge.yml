# Publica la página en https://ppam-entre-rios.web.app cada vez que se sube un cambio a main.
name: Publicar en Firebase
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PPAM_ENTRE_RIOS }}
          channelId: live
          projectId: ppam-entre-rios
