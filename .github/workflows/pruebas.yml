# Corre las pruebas en cada cambio que se sube a GitHub.
# Si algo falla, GitHub lo marca con una cruz roja en el commit y manda un aviso por email.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Pruebas de la app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  reglas:
    name: Pruebas de las reglas de Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm install --no-audit --no-fund
        working-directory: firebase/pruebas-reglas
      - run: npm test
        working-directory: firebase/pruebas-reglas
