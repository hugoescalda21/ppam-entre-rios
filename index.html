<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPAM Entre Ríos</title>
<meta name="description" content="Campañas de predicación pública metropolitana en Entre Ríos: horarios, puntos y turnos.">
<meta name="theme-color" content="#F6F5F1">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
<link rel="stylesheet" href="./app.css?v=7">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js?v=7"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-nav" viewBox="0 0 24 24"><path d="M3 11 21 3l-8 18-2-8z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 20l1.4-4A8 8 0 1 1 8 18.7z"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.2 11h10.3L20 7H6.3"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></symbol>
    <symbol id="i-stand" viewBox="0 0 24 24"><path d="M4 9h16l-2-5H6zM5 9v11M19 9v11M8 20h8M9 13h6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
    <symbol id="logo" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.8-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.2-6.5 11-6.5 11z" fill="#fff"/><circle cx="12" cy="10" r="2.6" fill="#B8924A"/></symbol>
  </defs></svg>

  <header class="tb" id="tb">
    <div class="tb-in">
      <div class="tb-row">
        <button type="button" class="back hidden" id="backBtn" aria-label="Volver"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
        <div class="brand" id="brand"><span class="mark"><svg width="20" height="20" aria-hidden="true"><use href="#logo"/></svg></span><div><b>PPAM Entre Ríos</b><small>Predicación pública</small></div></div>
        <span class="sp"></span>
        <button type="button" class="round hidden" id="shareBtn" aria-label="Compartir campaña"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg></button>
        <button type="button" class="login" id="userBtn">Ingresar</button>
      </div>
      <div class="tb-txt">
        <small id="tbKicker"></small>
        <h1 id="tbTitle"></h1>
        <p id="tbSub"></p>
        <div id="tbExtra"></div>
      </div>
    </div>
  </header>

  <main class="ct" id="app" aria-live="polite">
    <div class="empty">Cargando…</div>
  </main>

  <footer class="foot">
    <button type="button" class="linkish" id="privBtn">Cómo se usan tus datos</button>
  </footer>

  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <button type="button" id="tabHome" data-go="#/"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg>Inicio</button>
    <button type="button" id="tabMis" data-go="#/mis"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg>Mis turnos</button>
    <button type="button" id="coordBtn" class="hidden"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg>Coordinar</button>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js?v=7"></script>
</body>
</html>
